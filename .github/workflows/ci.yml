name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # The real gate: it must build, the trust audit must find no leak,
  # and the demo must run. No Joern anywhere in here.
  # ------------------------------------------------------------------ #
  build-and-audit:
    name: build + trust audit
    runs-on: ubuntu-latest
    # Fresh independent replay can consume an hour by itself; preserve time for
    # the clean build, integrity checks and conformance suite as well.
    timeout-minutes: 120

    steps:
      - name: Linux sandbox prerequisites (bubblewrap; unprivileged user namespaces)
        # This runner is an ephemeral VM for this job alone. AppArmor restricts unprivileged
        # user namespaces on Ubuntu 24.04; bubblewrap needs them to confine the code under test.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-net --ro-bind / / true
      - uses: actions/checkout@v4

      - name: Read toolchain
        id: toolchain
        run: echo "version=$(cat lean-toolchain)" >> "$GITHUB_OUTPUT"

      - name: Install elan / Lean (${{ steps.toolchain.outputs.version }})
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # elan defers the toolchain download to the first `lean` call; a transient
          # TLS failure there (2026-10-10, releases.lean-lang.org) killed the job
          # before anything was built. Fetch the toolchain here and retry.
          for attempt in 1 2 3 4 5; do
            "$HOME/.elan/bin/elan" run "$(cat lean-toolchain)" lean --version && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 30))
          done

      - name: Toolchain versions
        run: |
          lean --version
          lake --version
          # `leanchecker` (formerly the standalone `lean4checker`) ships with the
          # toolchain since v4.28.0, so there is nothing to build or cache. If this
          # line ever fails, the audit's check [3] would go UNVERIFIED rather than
          # silently passing -- but we would rather know here.
          # This toolchain does not provide a cheap --help probe; it can enter
          # kernel replay. Check availability here and run the actual audit below.
          command -v leanchecker

      # `Autoform/Generated/V8Base.lean` is a gitignored build product (the
      # "track the AST, not the render" policy, commit dbb8181 / docs/integrity.md)
      # -- but `Autoform.lean` has imported `Autoform.SpecsGen.V8Base` (which needs
      # it) since commit e36b8f1, once splitting it into 73 parts made it actually
      # elaborate. Nothing regenerated it in CI after that, so every run since has
      # failed at `lake build` with "no such file or directory" on this exact file
      # before a single module builds -- it only ever worked from a checkout that
      # happened to have this file left over locally from a prior manual render.
      # `render_lean.py` is a deterministic function of the tracked `ast-V8Base.json`
      # (verified byte-identical across runs), so regenerating it here is the same
      # artifact policy already relied on elsewhere, not a new trust assumption.
      # Runs before the cache step so the source hash below actually reflects it.
      - name: Regenerate Autoform/Generated/V8Base.lean from the tracked AST
        run: |
          set -euo pipefail
          python3 cartographer/render_lean.py ast-V8Base.json Autoform/Generated/V8Base.lean V8Base
          test -s Autoform/Generated/V8Base.lean

      # Autoform/Generated/CommonsLang3.lean is a gitignored render of the tracked AST; the
      # SpecsGen module and Autoform.CI import it, so `lake build` fails without this step.
      - name: Regenerate Autoform/Generated/CommonsLang3.lean from the tracked AST
        run: |
          set -euo pipefail
          python3 cartographer/render_lean.py ast-CommonsLang3.json Autoform/Generated/CommonsLang3.lean CommonsLang3
          test -s Autoform/Generated/CommonsLang3.lean

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake
          # lean-toolchain and the manifest between them pin every input that
          # affects the build products; the source hash keeps the cache honest.
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.toml', 'Autoform/**/*.lean', 'Autoform.lean') }}
          # Only a same-toolchain cache is worth restoring: a different toolchain's
          # .olean files are rebuilt anyway, and a prefix match across lines once
          # restored an `Autoform.olean` importing a module this tree never had
          # (2026-10-10; the demo step loaded it because nothing rebuilt the root).
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # `lake build` has no job-count/parallelism flag in this Lake version (confirmed
      # via `lake --help` / `lake build --help` -- neither exposes one). Left to its own
      # concurrency, it elaborates enough of Autoform/SpecsGen/V8Base/PartN.lean at once
      # to exceed a standard GitHub-hosted runner's ~7 GB RAM: reproduced locally in a
      # --memory=7g-capped container (`lean` OOM-killed, exit 137, partway through
      # V8Base/Part8) and confirmed on this repo's own runner (job killed, exit 143,
      # partway through the same V8Base parts) -- both only reachable at all after the
      # regeneration fix above, since every run before it died instantly on the missing
      # file. `taskset -c 0` pins the whole `lake build` process tree to one core, which
      # throttles how many elaboration jobs can be genuinely in flight at once (Lake still
      # reports the runner's real core count via nproc(), so a container/cgroup CPU quota
      # doesn't change what it tries to schedule -- pinning affinity does). Trades wall-
      # clock time for peace under the fixed memory ceiling, verified locally to keep
      # memory well under the cap through the same V8Base phase that previously OOM'd.
      # `Autoform.CI` is `Autoform.lean` minus `Autoform.SpecsGen.V8Base`: even on one
      # core the V8Base parts killed this job (exit 143 after Part4 on 2026-10-10), and the
      # heaviest by-computation spec modules hold more than this runner's memory. The
      # umbrella says which modules the runner proves; V8Base is gated by check_specs.py
      # and by the release checklist's full build.
      # Even pinned to one core, Lake keeps several elaborations in flight, and two
      # modules used to need ~13 GB each: `Autoform.SpecsGen.Cachetools` (13.0 GB) and
      # `Autoform.Specs.CachetoolsSpec` (13.6 GB), measured 2026-10-10 with
      # /usr/bin/time -l. Scheduled together they exceeded the runner (exit 143 after job
      # 401/405 on 2026-10-10).
      #
      # `Autoform.SpecsGen.Cachetools` is now emitted split by `scripts/synth_specs.py`
      # (`--split-gb 4`, roadmap 3.1): `Cachetools/Base.lean` + `Cachetools/Part1..9.lean`
      # under an umbrella, each part packed under a predicted 4 GB from the budget probe's
      # per-theorem profile. Measured 2026-10-10 (/usr/bin/time -l lake env lean, peak
      # RSS): Base 1.21 GB, Part1 1.56, Part2 1.81, Part3 11.27, Part4 1.68, Part5 1.63,
      # Part6 1.49, Part7 2.25, Part8 1.51, Part9 1.73, umbrella 1.18. One theorem --
      # `conform_cachetools___init___py__module__Cache___len`, Part3 -- costs 11.27 GB on
      # its own (a single kernel evaluation; per-case `decide +kernel`, `rfl` and `cbv`
      # variants were measured and are no cheaper), so the split cannot bound it and the
      # umbrella says so. That one part is still built alone, before anything else;
      # every other part is under 2.3 GB and the umbrella picks them up with the rest.
      # `Autoform.Specs.CachetoolsSpec` (hand-written) was split by hand the same way on
      # 2026-10-10 -- `CachetoolsSpec/Base.lean` + `Part1..7.lean`, theorems moved
      # verbatim, same namespace -- after measuring every theorem alone. Measured peak
      # RSS: Base 1.99 GB, Part1 1.36, Part2 1.73, Part3 1.94, Part4 11.06, Part5 2.11,
      # Part6 11.11, Part7 (the `_Link.unlink` ring specification, hyperscale-shards) 1.91,
      # umbrella 1.17. Two theorems cost ~11 GB each on their own, the two
      # constructor specifications (`Timer_init_mrefines`, Part4; `TTLLink_init_mrefines`,
      # Part6: `simp +decide` through two heap writes under class metadata), so those two
      # parts are built alone as well. Everything else is under 2.2 GB.
      - name: lake build
        run: |
          taskset -c 0 lake build Autoform.SpecsGen.Cachetools.Part3
          taskset -c 0 lake build Autoform.Specs.CachetoolsSpec.Part4
          taskset -c 0 lake build Autoform.Specs.CachetoolsSpec.Part6
          taskset -c 0 lake build Autoform.CI

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails the job on any trusted-code leak (sorryAx / ofReduceBool /
      # ofReduceNat, or a stray `sorry` outside Demo.lean), and on any .olean the
      # independent kernel replay rejects. See scripts/audit_all.py and
      # STRATEGY.md Tier 4.
      #
      # --strict additionally fails if `leanchecker` is missing, so the kernel
      # re-check can never be silently skipped in CI: an oracle that no-ops is
      # worse than no oracle (STRATEGY.md 19).
      - name: Trust audit sweep (incl. kernel re-verification)
        run: python3 scripts/audit_all.py --strict --module Autoform.CI

      - name: Upload audit.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-json
          path: audit.json
          if-no-files-found: warn

      # ---------------------------------------------------------------- #
      # Integrity checks. These were RED on main while CI was green, which
      # is precisely the failure mode this repo keeps re-learning: a check
      # that exists but is not run is a check that does not exist.
      # Each step below fails LOUDLY with an attributable reason; none of
      # them can pass by finding nothing (check_render exits 2 if it had
      # nothing to compare, check_docs exits 2 if an artifact is absent and
      # 1 if the artifact it cross-checks against is missing).
      # ---------------------------------------------------------------- #

      # Independent recomputation: re-render every tracked AST and compare
      # byte-for-byte with the committed module. This is the check that
      # caught a mutation-gate mutant which had survived four commits with
      # every proof still passing (STRATEGY.md 17/30/31).
      # Exit codes are load-bearing here: 1 = a committed module is NOT the render of
      # its committed AST (a real integrity failure), 2 = nothing was compared (the
      # check found nothing and must not pass), 3 = everything comparable verified but
      # some module could not be checked at all.
      #
      # Every exit but 0 fails. Until 2026-10-10 exit 3 was tolerated for exactly
      # Ansible, LinuxCrypto and LinuxLib, whose manifest entries pinned ASTs that no
      # clone could see (`ast_hint: /tmp/final-<M>.json`); those entries are gone from
      # artifact-manifest.json (docs/integrity.md, "Input availability"), so a module
      # the manifest promises and the tree cannot verify is now a failure, whichever
      # module it is. Do not add an allow-list back: a tolerated UNVERIFIABLE is the
      # noise a genuine mismatch hides in.
      - name: check_render — committed modules are renders of committed ASTs
        run: python3 scripts/check_render.py

      # A specification is a statement about a SPECIFIC RENDERING of a corpus. Closing a
      # hole changes what the translated function computes, so improving coverage can turn
      # a true law false -- three separate times in one day it did, and each time the build
      # stayed green because nothing tied a spec to the corpus version it was generated
      # against. This binds them by AST hash. A mismatch means re-generate the specs; it
      # does NOT mean re-record the hash, which would make the gate agree with anything.
      #
      # It exits 3 when a spec module is TRACKED but its corpus cannot be hashed from the
      # tree. That case used to exit 0: the corpus digest fell back to the manifest's own
      # `ast_sha256`, which is the same file the pin lives in, so the gate agreed with
      # itself and said nothing about the 74 tracked V8Base spec files. See STRATEGY.md 55.
      - name: check_specs_fresh — specs describe the corpus in the tree
        run: python3 scripts/check_specs_fresh.py

      # An AST is evidence about the exporter that produced it. Nothing recorded which
      # exporter that was: `provenance.py record` writes `joern_version` and
      # `exporter_sha256`, and for a long time nothing called it, so every committed AST
      # was unattributed and the field that would have flagged the character-literal fix
      # as a reason to re-export was never written (docs/integrity.md).
      #
      # This step is the cheap half of that. It does not re-export anything; it asks
      # whether each tracked AST is either attributed or named in
      # provenance/unattributed.json with a reason. The backlog is not an exemption: an
      # entry stops applying the moment its artifact's digest changes, so regenerating a
      # listed AST turns this step red until real provenance is recorded for it. That is
      # the whole point, and it is why the file cannot simply be topped up with today's
      # digests.
      #
      # Exit codes: 0 attributed or explicitly baselined, 1 a violation, 2 nothing
      # checked at all. 2 fails for the same reason it does everywhere else in this file
      # -- a check that passes by finding nothing is not a check.
      - name: check_provenance — every tracked AST is attributed or named
        run: python3 scripts/check_provenance.py

      # THE CONFORMANCE ORACLE MUST NOT BE DARK.
      #
      # differential.py is the only check that compares the semantics to a real runtime;
      # everything else compares the project to itself. It reported 534 of 534 cases
      # INCONCLUSIVE ("lean-no-answer") on cachetools for an unknown number of commits
      # while every gate in this file stayed green, because an oracle that CANNOT RUN
      # reported identically to one that ran and abstained -- and the headline read
      # "0 divergences", the best possible number.
      #
      # So this step does not check the agreement RATE, which moves with the corpus. It
      # checks that the oracle decided anything at all. Zero compared cases is a failure.
      # The corpus is not vendored: ast-Cachetools.json is tracked, the sources are not.
      # The harness needs the sources because it records its inputs by tracing the
      # project's own test suite, which is the whole reason its cases are realistic.
      - name: Fetch the cachetools corpus
        run: |
          set -euo pipefail
          rm -rf /tmp/cachetools
          # PINNED. `--depth 1` tracks upstream HEAD, so the corpus -- and therefore the
          # coverage denominator, which comes from tracing the corpus's own test suite --
          # could move without a commit here. That is the drifting-corpus trap this
          # project has already been caught by once. ast-Cachetools.json is exported from
          # THIS commit; re-pin and re-export together, never separately.
          git clone --no-checkout https://github.com/tkem/cachetools /tmp/cachetools
          git -C /tmp/cachetools checkout -q 01af8e5
          test -d /tmp/cachetools/src

      - name: Bundled Cachetools notice matches the pinned upstream revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          upstream = Path('/tmp/cachetools/LICENSE').read_text()
          bundled = Path('licenses/cachetools-MIT.txt').read_text()
          if upstream.split() != bundled.split():
              raise SystemExit('Bundled Cachetools notice differs from pinned upstream; review the original license before release.')
          print('License matched at', subprocess.check_output(
              ['git', '-C', '/tmp/cachetools', 'rev-parse', 'HEAD'], text=True).strip())
          PY

      - name: Conformance oracle is alive (compared > 0)
        run: |
          set -euo pipefail
          # `--no-cache`: this step exists to see the interpreter answer; a verdict
          # replayed from .autoform-work/oracle would not count as COMPARED anyway.
          PYTHONHASHSEED=0 AUTOFORM_NO_REEXEC=1 python3 scripts/differential.py \
            ast-Cachetools.json /tmp/cachetools Cachetools 5 --no-cache | tee /tmp/conf-ci.log
          compared=$(sed -n 's/.*, \([0-9]*\) COMPARED .*/\1/p' /tmp/conf-ci.log | head -1)
          echo "compared=${compared:-0}"
          if [ "${compared:-0}" -eq 0 ]; then
            echo "FAIL: the conformance oracle compared 0 cases. It is not deciding" >&2
            echo "anything, which is indistinguishable from agreeing about everything." >&2
            exit 1
          fi

      # check_docs cross-checks the ledger against the AST, and the ledger
      # is gitignored (it is a build product). On a fresh clone it is absent,
      # and check_docs correctly treats absence as a FAILURE rather than a
      # pass -- so CI has to produce it first. Regenerating it here is also
      # what makes the doc figures an independent recomputation: the ledger
      # is elaborated from the .olean by Lean, not copied from the docs.
      - name: Regenerate ledger-Cachetools.json from the built module
        run: |
          set -euo pipefail
          mkdir -p .ci-ledger
          sed 's/@MODULE@/Cachetools/g' scripts/ledger.lean.tmpl > .ci-ledger/Ledger.lean
          lake env lean .ci-ledger/Ledger.lean
          test -s ledger-Cachetools.json  # never let a silent no-op look like success

      # Same for the Java corpus (commons-lang3): docs/languages.md's matrix row quotes
      # its ledger, and check_docs binds those figures to ledger-CommonsLang3.json.
      - name: Regenerate ledger-CommonsLang3.json from the built module
        run: |
          set -euo pipefail
          mkdir -p .ci-ledger
          sed 's/@MODULE@/CommonsLang3/g' scripts/ledger.lean.tmpl > .ci-ledger/LedgerCommonsLang3.lean
          lake env lean .ci-ledger/LedgerCommonsLang3.lean
          test -s ledger-CommonsLang3.json

      - name: check_docs — documented figures match the artifacts
        run: python3 scripts/check_docs.py

      # The Python tooling is ~8,000 lines that gate every downstream claim; until
      # tests/ existed none of it was tested. Each of the five regression classes in
      # tests/test_regressions.py reconstructs a *silent* failure that once shipped,
      # so a green run here is evidence the checkers still fail when they should.
      - name: pytest — the Python tooling
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest -r requirements.txt
          python3 -m pytest tests/ -q

      # Cheap, deterministic guard on the one invariant this repo has an
      # explicit rule about: the fuel-monotonicity exclusion list. Widening
      # it is how a genuine break gets hidden instead of proved.
      - name: Fuel monotonicity has no excluded statements
        run: |
          set -euo pipefail
          line=$(grep -n 'def fuelMonoExclusions' Autoform/FuelMono.lean || true)
          test -n "$line" || { echo "FuelMono.lean no longer defines fuelMonoExclusions — this guard stopped guarding; fix it, do not delete it."; exit 1; }
          echo "$line" | grep -qF 'def fuelMonoExclusions : List String := []' || {
            echo "fuelMonoExclusions was changed: $line"
            echo 'It must be empty: fuel monotonicity is proved for every statement. A regression must not be hidden by an exclusion.'
            exit 1; }

      # Proof inventory. The floor used to be `grep -c '^ *theorem '`, and that is
      # exactly how the repository came to believe it had 108 theorems about
      # cachetools while `Autoform/SpecsGen/Cachetools.lean` had not type-checked
      # for weeks: no SpecsGen module was imported from Autoform.lean, so neither
      # `lake build` nor the audit's kernel replay ever looked at one, and grep
      # counts text. `Autoform/SpecsGen/Basis.lean` is now in the build, so its 21
      # theorems are kernel-checked above. The rest are gated here by ELABORATION.
      #
      # Only modules whose inputs are tracked can run in CI. Under the artifact
      # policy (docs/integrity.md) the large corpora's ASTs and renders are not in
      # git, so SpecsGen/V8Base, V8BaseSample, LinuxLib and LinuxLibSample cannot be
      # checked from a clean clone -- and check_specs.py says so, loudly, instead of
      # skipping them into a pass. They are checked by hand after a re-export.
      - name: Proof inventory does not shrink (by count)
        run: |
          set -euo pipefail
          fail=0
          check() {  # name floor file...
            name=$1; floor=$2; shift 2
            # `grep -c` exits 1 on a zero count; under `set -e` that used to abort the
            # step before its own REGRESSION line was printed.
            n=$(cat "$@" | grep -c '^ *theorem ' || true)
            echo "$name: $n theorems (floor $floor)"
            if [ "$n" -lt "$floor" ]; then
              echo "REGRESSION: $name lost proofs ($n < $floor)"; fail=1
            fi
          }
          # A floor here is a floor on TEXT: it stops a module's theorems being deleted
          # without a deliberate edit to this file. Whether the text PROVES anything is
          # decided by `lake build` above -- every module below is imported from
          # Autoform.lean and replayed by `leanchecker --fresh` in the trust audit -- never
          # by this count. A count on its own is how this repository once carried
          # 79 cachetools "theorems" that had not type-checked for weeks
          # (scripts/check_specs.py). Read the two together.
          #
          # Each floor is the count at the commit that last regenerated the module. A floor
          # goes DOWN only together with the regeneration that explains it:
          #   * SpecsGen/Cachetools: the 2026-10-09 re-land (d5bc3f2) replaced the 79-theorem
          #     module, whose fuel transport had been refuted (`C_not_tfFree`) and whose laws
          #     were largely open obligations, by 20 kernel-proved conformance theorems with
          #     an empty `obligations` list. The refutation guard that lived below is retired
          #     with the premise it guarded; the anti-vacuity guard below replaces it.
          #   * SpecsGen/V8Base: the module is an umbrella over Autoform/SpecsGen/V8Base/
          #     Part*.lean since e36b8f1 (one shared Base, 73 parts), so the theorems are
          #     counted there; Base.lean holds the single context theorem.
          #   * SpecsGen/Cachetools: since the 2026-10-10 regeneration `synth_specs.py`
          #     emits it split (`--split-gb`): the umbrella Autoform/SpecsGen/Cachetools.lean
          #     holds only `obligations`, the theorems are in Cachetools/Part*.lean and are
          #     counted there, like V8Base. Still 20.
          check SpecsGen-Cachetools 20  Autoform/SpecsGen/Cachetools/Part*.lean
          check SpecsGen-V8Base     284 Autoform/SpecsGen/V8Base/Part*.lean
          check SpecsGen-Basis      35  Autoform/SpecsGen/Basis.lean
          check SpecsGen-LinuxLib   12  Autoform/SpecsGen/LinuxLib.lean
          check Refine              119 Autoform/Refine.lean
          exit $fail

      # ...and the count is only meaningful for a module that proves. Every SpecsGen
      # module is now imported from Autoform.lean (Cachetools, V8Base and its 73 parts,
      # LinuxLib, the samples, Basis), so `lake build` above is the elaboration verdict
      # for all of them. This step keeps scripts/check_specs.py itself exercised on the
      # smallest module: it is the tool a re-export is checked with by hand.
      - name: SpecsGen modules elaborate
        run: python3 scripts/check_specs.py Basis

      # Do NOT add a "standalone modules elaborate" step for a module you merely hope is
      # checked: check that Autoform.lean imports it. Modules used to sit outside the graph
      # because every generated corpus declared `Autoform.Generated.program`; each corpus
      # now owns `Autoform.Generated.<Module>`, so they all coexist in one build.

      # SpecsGen/Cachetools claims that `#audit_depends` fails the build for any
      # theorem whose proof never mentions the implementation it constrains. That gate
      # only covers the theorems it is asked about, so a theorem added without a matching
      # `#audit_depends` line would be ungated and the build would stay green. This step
      # checks that the two lists are the same set, and that the module still declares
      # its open obligations by name (an empty list is a claim; a missing one is silence).
      # The module is split (see the build step): the theorems and their gates are in
      # Cachetools/Part*.lean, each part gating exactly the theorems it states, and the
      # umbrella Cachetools.lean declares `obligations`. The umbrella is also checked to
      # import every part on disk, so a part nothing imports cannot pad the count above.
      - name: SpecsGen/Cachetools — every theorem is under the anti-vacuity gate
        run: |
          set -euo pipefail
          umbrella=Autoform/SpecsGen/Cachetools.lean
          fail=0
          for f in Autoform/SpecsGen/Cachetools/Part*.lean; do
            theorems=$(grep -o '^ *theorem [A-Za-z0-9_]*' "$f" | awk '{print $2}' | sort)
            gated=$(grep -o '^#audit_depends [A-Za-z0-9_]*' "$f" | awk '{print $2}' | sort)
            if [ "$theorems" != "$gated" ]; then
              echo "$f: theorems and #audit_depends lines differ (< theorem only, > gate only):"
              diff <(echo "$theorems") <(echo "$gated") || true
              fail=1
            fi
            part=$(basename "$f" .lean)
            grep -q "^import Autoform.SpecsGen.Cachetools.$part\$" "$umbrella" || {
              echo "$umbrella does not import $part; the part is not in the build"; fail=1; }
          done
          grep -q '^def obligations : List OpenObligation :=' "$umbrella" || {
            echo "SpecsGen/Cachetools.lean no longer declares its open obligations."; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          n=$(cat Autoform/SpecsGen/Cachetools/Part*.lean | grep -c '^ *theorem ')
          echo "$n theorems over $(ls Autoform/SpecsGen/Cachetools/Part*.lean | wc -l) parts, each with an #audit_depends line in its part; obligations declared"

      # The artifact policy makes the AST the tracked source of truth and the
      # render a build product. check_render verifies both halves against
      # artifact-manifest.json and reports UNVERIFIABLE (non-zero) when an AST is
      # absent rather than passing on an empty comparison.
      - name: check_specs / check_render report, for the log
        if: always()
        run: |
          python3 scripts/check_render.py || true

      # Demo.lean deliberately contains a `sorry`-admitted theorem and two
      # deliberately-failing audits, to demonstrate that the audit catches them.
      # `lean` therefore exits non-zero by design; what we check is that it runs
      # and that the expected diagnostics appear.
      - name: Run the demo
        run: |
          set -o pipefail
          lake env lean Demo.lean 2>&1 | tee demo.out || true
          grep -q "TRUSTED-CODE LEAK" demo.out
          grep -q "VACUOUS" demo.out

  # ------------------------------------------------------------------ #
  # The Joern-gated suites. Everything above runs without Joern by design;
  # these are the tests that compare the exporter's output to the REAL
  # runtimes -- CPython, cc, javac, go, node -- through the real frontend.
  # They live behind AUTOFORM_TEST_JOERN=1 because Joern is a ~1.7 GB
  # download, which means an ordinary `pytest` never runs them and a
  # regression in the numeric or signature semantics is invisible until
  # someone remembers to set the flag. So they run here, on every push.
  #
  # Two guards that are easy to get wrong:
  #   * Joern is installed from the pinned release asset, never
  #     `joern-install.sh` and never "latest": the neutral AST is a function
  #     of the frontend build (docs/running.md §1), and the pin is checked
  #     against the jars actually on disk before a single test runs.
  #   * A gated test that SKIPS still shows green. The last step fails the
  #     job if pytest reports the skip reason these tests use, because a
  #     silently skipped gate is exactly the shape of failure this repository
  #     keeps re-learning (an oracle that no-ops looks like one that passes).
  # ------------------------------------------------------------------ #
  joern-gated:
    name: Joern-gated suites (real frontend, real runtimes)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Linux sandbox prerequisites (bubblewrap; unprivileged user namespaces)
        # This runner is an ephemeral VM for this job alone. AppArmor restricts unprivileged
        # user namespaces on Ubuntu 24.04; bubblewrap needs them to confine the code under test.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-net --ro-bind / / true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Install elan / Lean (pinned)
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # elan defers the toolchain download to the first `lean` call; a transient
          # TLS failure there (2026-10-10, releases.lean-lang.org) killed the job
          # before anything was built. Fetch the toolchain here and retry.
          for attempt in 1 2 3 4 5; do
            "$HOME/.elan/bin/elan" run "$(cat lean-toolchain)" lean --version && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 30))
          done

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.toml', 'Autoform/**/*.lean', 'Autoform.lean') }}
          # Only a same-toolchain cache is worth restoring: a different toolchain's
          # .olean files are rebuilt anyway, and a prefix match across lines once
          # restored an `Autoform.olean` importing a module this tree never had
          # (2026-10-10; the demo step loaded it because nothing rebuilt the root).
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - uses: actions/cache@v4
        id: joern
        with:
          path: ~/joern
          key: joern-${{ runner.os }}-${{ hashFiles('joern-version') }}

      - name: Install pinned Joern
        if: steps.joern.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # The release ships per-platform zips (joern-cli-linux-x86_64.zip, ...); there is
          # no joern-cli.zip, so that URL was a 404 that failed every Joern-gated job.
          ASSET="joern-cli-linux-x86_64.zip"
          # The .sha512 manifest names the zip as target/<asset>, so it is fetched there.
          mkdir -p /tmp/joern-dl/target "$HOME/joern"
          curl -fL "https://github.com/joernio/joern/releases/download/v$(cat joern-version)/${ASSET}" -o "/tmp/joern-dl/target/${ASSET}"
          curl -fL "https://github.com/joernio/joern/releases/download/v$(cat joern-version)/${ASSET}.sha512" -o "/tmp/joern-dl/${ASSET}.sha512"
          (cd /tmp/joern-dl && sha512sum -c "${ASSET}.sha512")
          unzip -q "/tmp/joern-dl/target/${ASSET}" -d "$HOME/joern"

      # Reads the version out of the jar names on disk, as provenance.py does. This is
      # what catches an installer that "exited 0" having installed nothing.
      - name: Installed Joern matches the pin
        run: python3 scripts/provenance.py joern-version --check

      - name: Install the Python tooling
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest -r requirements.txt

      # JOERN_HOME is deliberately unset: every harness defaults to ~/joern, which is
      # where the step above unpacked it, and `${{ env.HOME }}` is not a job-level
      # expression GitHub evaluates.
      - name: Gated suites against the real runtimes
        env:
          AUTOFORM_TEST_JOERN: '1'
        run: |
          set -euo pipefail
          python3 -m pytest -q -rs \
            tests/test_source_numeric.py \
            tests/test_python_signatures.py \
            tests/test_python_receivers.py \
            tests/test_python_binding.py \
            tests/test_python_callable_shapes.py \
            tests/test_python_handlers.py \
            tests/test_python_raises.py \
            tests/test_control_flow.py \
            tests/test_production_gaps.py \
            2>&1 | tee /tmp/gated.log

      - name: The gate actually ran (no test skipped for want of Joern)
        run: |
          set -euo pipefail
          if grep -q 'set AUTOFORM_TEST_JOERN=1' /tmp/gated.log; then
            echo "FAIL: at least one Joern-gated test SKIPPED. Joern was installed above, so" >&2
            echo "the skip means the harness could not see it -- a gate that skips is a gate" >&2
            echo "that passed by not looking. Skip reasons:" >&2
            grep 'SKIPPED' /tmp/gated.log >&2 || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joern-gated-evidence
          path: |
            /tmp/gated.log
            artifacts/pipeline/
          if-no-files-found: warn
