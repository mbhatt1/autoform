name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # The real gate: it must build, the trust audit must find no leak,
  # and the demo must run. No Joern anywhere in here.
  # ------------------------------------------------------------------ #
  build-and-audit:
    name: build + trust audit
    runs-on: ubuntu-latest
    # Fresh independent replay can consume an hour by itself; preserve time for
    # the clean build, integrity checks and conformance suite as well.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain
        id: toolchain
        run: echo "version=$(cat lean-toolchain)" >> "$GITHUB_OUTPUT"

      - name: Install elan / Lean (${{ steps.toolchain.outputs.version }})
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          lean --version
          lake --version
          # `leanchecker` (formerly the standalone `lean4checker`) ships with the
          # toolchain since v4.28.0, so there is nothing to build or cache. If this
          # line ever fails, the audit's check [3] would go UNVERIFIED rather than
          # silently passing -- but we would rather know here.
          # This toolchain does not provide a cheap --help probe; it can enter
          # kernel replay. Check availability here and run the actual audit below.
          command -v leanchecker

      # `Autoform/Generated/V8Base.lean` is a gitignored build product (the
      # "track the AST, not the render" policy, commit dbb8181 / docs/integrity.md)
      # -- but `Autoform.lean` has imported `Autoform.SpecsGen.V8Base` (which needs
      # it) since commit e36b8f1, once splitting it into 73 parts made it actually
      # elaborate. Nothing regenerated it in CI after that, so every run since has
      # failed at `lake build` with "no such file or directory" on this exact file
      # before a single module builds -- it only ever worked from a checkout that
      # happened to have this file left over locally from a prior manual render.
      # `render_lean.py` is a deterministic function of the tracked `ast-V8Base.json`
      # (verified byte-identical across runs), so regenerating it here is the same
      # artifact policy already relied on elsewhere, not a new trust assumption.
      # Runs before the cache step so the source hash below actually reflects it.
      - name: Regenerate Autoform/Generated/V8Base.lean from the tracked AST
        run: |
          set -euo pipefail
          python3 cartographer/render_lean.py ast-V8Base.json Autoform/Generated/V8Base.lean V8Base
          test -s Autoform/Generated/V8Base.lean

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake
          # lean-toolchain and the manifest between them pin every input that
          # affects the build products; the source hash keeps the cache honest.
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.toml', 'Autoform/**/*.lean', 'Autoform.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-

      # `lake build` has no job-count/parallelism flag in this Lake version (confirmed
      # via `lake --help` / `lake build --help` -- neither exposes one). Left to its own
      # concurrency, it elaborates enough of Autoform/SpecsGen/V8Base/PartN.lean at once
      # to exceed a standard GitHub-hosted runner's ~7 GB RAM: reproduced locally in a
      # --memory=7g-capped container (`lean` OOM-killed, exit 137, partway through
      # V8Base/Part8) and confirmed on this repo's own runner (job killed, exit 143,
      # partway through the same V8Base parts) -- both only reachable at all after the
      # regeneration fix above, since every run before it died instantly on the missing
      # file. `taskset -c 0` pins the whole `lake build` process tree to one core, which
      # throttles how many elaboration jobs can be genuinely in flight at once (Lake still
      # reports the runner's real core count via nproc(), so a container/cgroup CPU quota
      # doesn't change what it tries to schedule -- pinning affinity does). Trades wall-
      # clock time for peace under the fixed memory ceiling, verified locally to keep
      # memory well under the cap through the same V8Base phase that previously OOM'd.
      - name: lake build
        run: taskset -c 0 lake build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails the job on any trusted-code leak (sorryAx / ofReduceBool /
      # ofReduceNat, or a stray `sorry` outside Demo.lean), and on any .olean the
      # independent kernel replay rejects. See scripts/audit_all.py and
      # STRATEGY.md Tier 4.
      #
      # --strict additionally fails if `leanchecker` is missing, so the kernel
      # re-check can never be silently skipped in CI: an oracle that no-ops is
      # worse than no oracle (STRATEGY.md 19).
      - name: Trust audit sweep (incl. kernel re-verification)
        run: python3 scripts/audit_all.py --strict

      - name: Upload audit.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-json
          path: audit.json
          if-no-files-found: warn

      # ---------------------------------------------------------------- #
      # Integrity checks. These were RED on main while CI was green, which
      # is precisely the failure mode this repo keeps re-learning: a check
      # that exists but is not run is a check that does not exist.
      # Each step below fails LOUDLY with an attributable reason; none of
      # them can pass by finding nothing (check_render exits 2 if it had
      # nothing to compare, check_docs exits 2 if an artifact is absent and
      # 1 if the artifact it cross-checks against is missing).
      # ---------------------------------------------------------------- #

      # Independent recomputation: re-render every tracked AST and compare
      # byte-for-byte with the committed module. This is the check that
      # caught a mutation-gate mutant which had survived four commits with
      # every proof still passing (STRATEGY.md 17/30/31).
      # Exit codes are load-bearing here: 1 = a committed module is NOT the render of
      # its committed AST (a real integrity failure), 2 = nothing was compared (the
      # check found nothing and must not pass), 3 = everything comparable verified but
      # some module could not be checked at all.
      #
      # Only 3 is tolerated, and only for the three corpora whose ASTs are too large to
      # track in git (docs/integrity.md) -- Ansible, LinuxCrypto, LinuxLib. Those are a
      # standing, documented condition, so treating 3 as a hard failure made this step
      # permanently red, which is how a genuine mismatch would have gone unnoticed among
      # the noise. A module becoming unverifiable for any OTHER reason still fails.
      - name: check_render — committed modules are renders of committed ASTs
        run: |
          set -o pipefail
          status=0
          python3 scripts/check_render.py 2>&1 | tee /tmp/check_render.log || status=$?
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ "$status" -ne 3 ]; then
            echo "check_render failed with exit $status (1 = mismatch, 2 = nothing compared)." >&2
            exit "$status"
          fi
          unexpected=$(grep '^UNVERIFIABLE ' /tmp/check_render.log \
            | sed 's/^UNVERIFIABLE \([A-Za-z0-9_]*\):.*/\1/' \
            | grep -vxE 'Ansible|LinuxCrypto|LinuxLib' || true)
          if [ -n "$unexpected" ]; then
            echo "check_render: unexpected UNVERIFIABLE module(s):" >&2
            echo "$unexpected" >&2
            echo "Only Ansible, LinuxCrypto and LinuxLib may be unverifiable (ASTs too large to track)." >&2
            exit 3
          fi
          echo "check_render: verified everything comparable; the 3 large corpora remain unverifiable by policy."

      # A specification is a statement about a SPECIFIC RENDERING of a corpus. Closing a
      # hole changes what the translated function computes, so improving coverage can turn
      # a true law false -- three separate times in one day it did, and each time the build
      # stayed green because nothing tied a spec to the corpus version it was generated
      # against. This binds them by AST hash. A mismatch means re-generate the specs; it
      # does NOT mean re-record the hash, which would make the gate agree with anything.
      #
      # It exits 3 when a spec module is TRACKED but its corpus cannot be hashed from the
      # tree. That case used to exit 0: the corpus digest fell back to the manifest's own
      # `ast_sha256`, which is the same file the pin lives in, so the gate agreed with
      # itself and said nothing about the 74 tracked V8Base spec files. See STRATEGY.md 55.
      - name: check_specs_fresh — specs describe the corpus in the tree
        run: python3 scripts/check_specs_fresh.py

      # An AST is evidence about the exporter that produced it. Nothing recorded which
      # exporter that was: `provenance.py record` writes `joern_version` and
      # `exporter_sha256`, and for a long time nothing called it, so every committed AST
      # was unattributed and the field that would have flagged the character-literal fix
      # as a reason to re-export was never written (docs/integrity.md).
      #
      # This step is the cheap half of that. It does not re-export anything; it asks
      # whether each tracked AST is either attributed or named in
      # provenance/unattributed.json with a reason. The backlog is not an exemption: an
      # entry stops applying the moment its artifact's digest changes, so regenerating a
      # listed AST turns this step red until real provenance is recorded for it. That is
      # the whole point, and it is why the file cannot simply be topped up with today's
      # digests.
      #
      # Exit codes: 0 attributed or explicitly baselined, 1 a violation, 2 nothing
      # checked at all. 2 fails for the same reason it does everywhere else in this file
      # -- a check that passes by finding nothing is not a check.
      - name: check_provenance — every tracked AST is attributed or named
        run: python3 scripts/check_provenance.py

      # THE CONFORMANCE ORACLE MUST NOT BE DARK.
      #
      # differential.py is the only check that compares the semantics to a real runtime;
      # everything else compares the project to itself. It reported 534 of 534 cases
      # INCONCLUSIVE ("lean-no-answer") on cachetools for an unknown number of commits
      # while every gate in this file stayed green, because an oracle that CANNOT RUN
      # reported identically to one that ran and abstained -- and the headline read
      # "0 divergences", the best possible number.
      #
      # So this step does not check the agreement RATE, which moves with the corpus. It
      # checks that the oracle decided anything at all. Zero compared cases is a failure.
      # The corpus is not vendored: ast-Cachetools.json is tracked, the sources are not.
      # The harness needs the sources because it records its inputs by tracing the
      # project's own test suite, which is the whole reason its cases are realistic.
      - name: Fetch the cachetools corpus
        run: |
          set -euo pipefail
          rm -rf /tmp/cachetools
          # PINNED. `--depth 1` tracks upstream HEAD, so the corpus -- and therefore the
          # coverage denominator, which comes from tracing the corpus's own test suite --
          # could move without a commit here. That is the drifting-corpus trap this
          # project has already been caught by once. ast-Cachetools.json is exported from
          # THIS commit; re-pin and re-export together, never separately.
          git clone --no-checkout https://github.com/tkem/cachetools /tmp/cachetools
          git -C /tmp/cachetools checkout -q 01af8e5
          test -d /tmp/cachetools/src

      - name: Bundled Cachetools notice matches the pinned upstream revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          upstream = Path('/tmp/cachetools/LICENSE').read_text()
          bundled = Path('licenses/cachetools-MIT.txt').read_text()
          if upstream.split() != bundled.split():
              raise SystemExit('Bundled Cachetools notice differs from pinned upstream; review the original license before release.')
          print('License matched at', subprocess.check_output(
              ['git', '-C', '/tmp/cachetools', 'rev-parse', 'HEAD'], text=True).strip())
          PY

      - name: Conformance oracle is alive (compared > 0)
        run: |
          set -euo pipefail
          PYTHONHASHSEED=0 AUTOFORM_NO_REEXEC=1 python3 scripts/differential.py \
            ast-Cachetools.json /tmp/cachetools Cachetools 5 | tee /tmp/conf-ci.log
          compared=$(sed -n 's/.*, \([0-9]*\) COMPARED .*/\1/p' /tmp/conf-ci.log | head -1)
          echo "compared=${compared:-0}"
          if [ "${compared:-0}" -eq 0 ]; then
            echo "FAIL: the conformance oracle compared 0 cases. It is not deciding" >&2
            echo "anything, which is indistinguishable from agreeing about everything." >&2
            exit 1
          fi

      # check_docs cross-checks the ledger against the AST, and the ledger
      # is gitignored (it is a build product). On a fresh clone it is absent,
      # and check_docs correctly treats absence as a FAILURE rather than a
      # pass -- so CI has to produce it first. Regenerating it here is also
      # what makes the doc figures an independent recomputation: the ledger
      # is elaborated from the .olean by Lean, not copied from the docs.
      - name: Regenerate ledger-Cachetools.json from the built module
        run: |
          set -euo pipefail
          mkdir -p .ci-ledger
          sed 's/@MODULE@/Cachetools/g' scripts/ledger.lean.tmpl > .ci-ledger/Ledger.lean
          lake env lean .ci-ledger/Ledger.lean
          test -s ledger-Cachetools.json  # never let a silent no-op look like success

      - name: check_docs — documented figures match the artifacts
        run: python3 scripts/check_docs.py

      # The Python tooling is ~8,000 lines that gate every downstream claim; until
      # tests/ existed none of it was tested. Each of the five regression classes in
      # tests/test_regressions.py reconstructs a *silent* failure that once shipped,
      # so a green run here is evidence the checkers still fail when they should.
      - name: pytest — the Python tooling
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest -r requirements.txt
          python3 -m pytest tests/ -q

      # Cheap, deterministic guard on the one invariant this repo has an
      # explicit rule about: the fuel-monotonicity exclusion list. Widening
      # it is how a genuine break gets hidden instead of proved.
      - name: Fuel monotonicity has no excluded statements
        run: |
          set -euo pipefail
          line=$(grep -n 'def fuelMonoExclusions' Autoform/FuelMono.lean || true)
          test -n "$line" || { echo "FuelMono.lean no longer defines fuelMonoExclusions — this guard stopped guarding; fix it, do not delete it."; exit 1; }
          echo "$line" | grep -qF 'def fuelMonoExclusions : List String := []' || {
            echo "fuelMonoExclusions was changed: $line"
            echo 'It must be empty: fuel monotonicity is proved for every statement. A regression must not be hidden by an exclusion.'
            exit 1; }

      # Proof inventory. The floor used to be `grep -c '^ *theorem '`, and that is
      # exactly how the repository came to believe it had 108 theorems about
      # cachetools while `Autoform/SpecsGen/Cachetools.lean` had not type-checked
      # for weeks: no SpecsGen module was imported from Autoform.lean, so neither
      # `lake build` nor the audit's kernel replay ever looked at one, and grep
      # counts text. `Autoform/SpecsGen/Basis.lean` is now in the build, so its 21
      # theorems are kernel-checked above. The rest are gated here by ELABORATION.
      #
      # Only modules whose inputs are tracked can run in CI. Under the artifact
      # policy (docs/integrity.md) the large corpora's ASTs and renders are not in
      # git, so SpecsGen/V8Base, V8BaseSample, LinuxLib and LinuxLibSample cannot be
      # checked from a clean clone -- and check_specs.py says so, loudly, instead of
      # skipping them into a pass. They are checked by hand after a re-export.
      - name: Proof inventory does not shrink (by count)
        run: |
          set -euo pipefail
          fail=0
          check() {  # name file floor
            n=$(grep -c '^ *theorem ' "$2")
            echo "$1: $n theorems (floor $3)"
            if [ "$n" -lt "$3" ]; then
              echo "REGRESSION: $2 lost proofs ($n < $3)"; fail=1
            fi
          }
          # A floor here is a floor on TEXT. SpecsGen/V8Base still does not elaborate --
          # see STRATEGY.md 40 -- so its count is recorded to stop the text being deleted
          # while it waits for regeneration, NOT as a claim that it proves anything. The
          # elaboration verdict is the step below; read them together. SpecsGen/Cachetools
          # DOES elaborate again and is imported from Autoform.lean, so `lake build` proves it; 72 of its laws
          # are now Prop-valued open obligations (the fuel transport is refuted, not
          # assumed) with their FUEL-instantiated content kept as *_at_FUEL theorems, so
          # its text count is higher than the old floor and the floor stays where it was.
          check SpecsGen-Cachetools Autoform/SpecsGen/Cachetools.lean 79
          check SpecsGen-V8Base     Autoform/SpecsGen/V8Base.lean    229   # DOES NOT PROVE
          check SpecsGen-Basis      Autoform/SpecsGen/Basis.lean      21
          check SpecsGen-LinuxLib   Autoform/SpecsGen/LinuxLib.lean   12
          check Refine              Autoform/Refine.lean             113
          exit $fail

      # ...and the count is only meaningful for a module that proves. This is the
      # check the count was standing in for.
      - name: SpecsGen modules elaborate
        run: python3 scripts/check_specs.py Basis

      # The "Standalone modules elaborate" step that used to live here is GONE, and the
      # reason it is gone is that its five modules -- Autoform.BuiltinBase,
      # Autoform.Contracts, Autoform.Specs.CachetoolsSpec, Autoform.SpecsGen.Cachetools
      # and Autoform.Specs.V8Spec -- are now imported from Autoform.lean, so `lake build`
      # above elaborates every one of them and `leanchecker --fresh` in the trust audit
      # replays them. They were outside the graph only because every generated corpus
      # declared `Autoform.Generated.program`; each corpus now owns
      # `Autoform.Generated.<Module>`, so cachetools and V8 coexist in one build.
      #
      # Do NOT re-add a step like that for a module you merely hope is checked: check that
      # Autoform.lean imports it. `Autoform.SpecsGen.V8Base` is the one module still
      # outside, for elaboration cost rather than namespaces (see Autoform.lean), and it
      # is gated by scripts/check_specs.py, not by grep.

      # SpecsGen/Cachetools.lean used to be pinned here as KNOWN BROKEN. It elaborates
      # again as of this change, and is built by the step above. Its `C_tfFree` premise
      # -- every body in the function table is `tryFinally`-free -- is now FALSE (the
      # exporter learned to translate try/finally; 8 rendered bodies carry it), so the
      # module states `C_not_tfFree`, a refutation, and the 72 laws that rested on the
      # transport are `Prop`-valued open obligations whose FUEL-instantiated content is
      # kept as `*_at_FUEL` theorems. This step guards that framing: if the refutation
      # ever stops holding, the module stops elaborating above and this comment is the
      # place to start.
      - name: SpecsGen/Cachetools records the refutation, not the premise
        run: |
          set -euo pipefail
          grep -q 'theorem C_not_tfFree : ¬ TFFreeCtx C' Autoform/SpecsGen/Cachetools.lean || {
            echo "SpecsGen/Cachetools.lean no longer refutes TFFreeCtx C."
            echo "If the corpus lost its tryFinally bodies, restore C_tfFree and the"
            echo "transported theorems -- do not just drop this check."; exit 1; }

      # The artifact policy makes the AST the tracked source of truth and the
      # render a build product. check_render verifies both halves against
      # artifact-manifest.json and reports UNVERIFIABLE (non-zero) when an AST is
      # absent rather than passing on an empty comparison.
      - name: check_specs / check_render report, for the log
        if: always()
        run: |
          python3 scripts/check_render.py || true

      # Demo.lean deliberately contains a `sorry`-admitted theorem and two
      # deliberately-failing audits, to demonstrate that the audit catches them.
      # `lean` therefore exits non-zero by design; what we check is that it runs
      # and that the expected diagnostics appear.
      - name: Run the demo
        run: |
          set -o pipefail
          lake env lean Demo.lean 2>&1 | tee demo.out || true
          grep -q "TRUSTED-CODE LEAK" demo.out
          grep -q "VACUOUS" demo.out
