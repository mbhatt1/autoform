name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_joern:
        description: >-
          Also run the Joern end-to-end pipeline job. Off by default: installing
          Joern is a ~1.7 GB download, so it is never part of the gating build.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # The real gate: it must build, the trust audit must find no leak,
  # and the demo must run. No Joern anywhere in here.
  # ------------------------------------------------------------------ #
  build-and-audit:
    name: build + trust audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain
        id: toolchain
        run: echo "version=$(cat lean-toolchain)" >> "$GITHUB_OUTPUT"

      - name: Install elan / Lean (${{ steps.toolchain.outputs.version }})
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          lean --version
          lake --version
          # `leanchecker` (formerly the standalone `lean4checker`) ships with the
          # toolchain since v4.28.0, so there is nothing to build or cache. If this
          # line ever fails, the audit's check [3] would go UNVERIFIED rather than
          # silently passing -- but we would rather know here.
          lake env leanchecker --help >/dev/null 2>&1 || which leanchecker

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake
          # lean-toolchain and the manifest between them pin every input that
          # affects the build products; the source hash keeps the cache honest.
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.toml', 'Autoform/**/*.lean', 'Autoform.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-

      - name: lake build
        run: lake build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails the job on any trusted-code leak (sorryAx / ofReduceBool /
      # ofReduceNat, or a stray `sorry` outside Demo.lean), and on any .olean the
      # independent kernel replay rejects. See scripts/audit_all.py and
      # STRATEGY.md Tier 4.
      #
      # --strict additionally fails if `leanchecker` is missing, so the kernel
      # re-check can never be silently skipped in CI: an oracle that no-ops is
      # worse than no oracle (STRATEGY.md 19).
      - name: Trust audit sweep (incl. kernel re-verification)
        run: python3 scripts/audit_all.py --strict

      - name: Upload audit.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-json
          path: audit.json
          if-no-files-found: warn

      # ---------------------------------------------------------------- #
      # Integrity checks. These were RED on main while CI was green, which
      # is precisely the failure mode this repo keeps re-learning: a check
      # that exists but is not run is a check that does not exist.
      # Each step below fails LOUDLY with an attributable reason; none of
      # them can pass by finding nothing (check_render exits 2 if it had
      # nothing to compare, check_docs exits 2 if an artifact is absent and
      # 1 if the artifact it cross-checks against is missing).
      # ---------------------------------------------------------------- #

      # Independent recomputation: re-render every tracked AST and compare
      # byte-for-byte with the committed module. This is the check that
      # caught a mutation-gate mutant which had survived four commits with
      # every proof still passing (STRATEGY.md 17/30/31).
      - name: check_render — committed modules are renders of committed ASTs
        run: python3 scripts/check_render.py

      # check_docs cross-checks the ledger against the AST, and the ledger
      # is gitignored (it is a build product). On a fresh clone it is absent,
      # and check_docs correctly treats absence as a FAILURE rather than a
      # pass -- so CI has to produce it first. Regenerating it here is also
      # what makes the doc figures an independent recomputation: the ledger
      # is elaborated from the .olean by Lean, not copied from the docs.
      - name: Regenerate ledger-Cachetools.json from the built module
        run: |
          set -euo pipefail
          mkdir -p .ci-ledger
          sed 's/@MODULE@/Cachetools/g' scripts/ledger.lean.tmpl > .ci-ledger/Ledger.lean
          lake env lean .ci-ledger/Ledger.lean
          test -s ledger-Cachetools.json  # never let a silent no-op look like success

      - name: check_docs — documented figures match the artifacts
        run: python3 scripts/check_docs.py

      # The Python tooling is ~8,000 lines that gate every downstream claim; until
      # tests/ existed none of it was tested. Each of the five regression classes in
      # tests/test_regressions.py reconstructs a *silent* failure that once shipped,
      # so a green run here is evidence the checkers still fail when they should.
      - name: pytest — the Python tooling
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      # Cheap, deterministic guard on the one invariant this repo has an
      # explicit rule about: the fuel-monotonicity exclusion list. Widening
      # it is how a genuine break gets hidden instead of proved.
      - name: FuelMono exclusion list is exactly ["Stmt.tryFinally"]
        run: |
          set -euo pipefail
          line=$(grep -n 'def fuelMonoExclusions' Autoform/FuelMono.lean || true)
          test -n "$line" || { echo "FuelMono.lean no longer defines fuelMonoExclusions — this guard stopped guarding; fix it, do not delete it."; exit 1; }
          echo "$line" | grep -qF 'def fuelMonoExclusions : List String := ["Stmt.tryFinally"]' || {
            echo "fuelMonoExclusions was changed: $line"
            echo 'It must be exactly ["Stmt.tryFinally"]. A genuine break needs a proved counterexample, not a wider exclusion list.'
            exit 1; }

      # Proof inventory. The floor used to be `grep -c '^ *theorem '`, and that is
      # exactly how the repository came to believe it had 108 theorems about
      # cachetools while `Autoform/SpecsGen/Cachetools.lean` had not type-checked
      # for weeks: no SpecsGen module was imported from Autoform.lean, so neither
      # `lake build` nor the audit's kernel replay ever looked at one, and grep
      # counts text. `Autoform/SpecsGen/Basis.lean` is now in the build, so its 21
      # theorems are kernel-checked above. The rest are gated here by ELABORATION.
      #
      # Only modules whose inputs are tracked can run in CI. Under the artifact
      # policy (docs/integrity.md) the large corpora's ASTs and renders are not in
      # git, so SpecsGen/V8Base, V8BaseSample, LinuxLib and LinuxLibSample cannot be
      # checked from a clean clone -- and check_specs.py says so, loudly, instead of
      # skipping them into a pass. They are checked by hand after a re-export.
      - name: Proof inventory does not shrink (by count)
        run: |
          set -euo pipefail
          fail=0
          check() {  # name file floor
            n=$(grep -c '^ *theorem ' "$2")
            echo "$1: $n theorems (floor $3)"
            if [ "$n" -lt "$3" ]; then
              echo "REGRESSION: $2 lost proofs ($n < $3)"; fail=1
            fi
          }
          check SpecsGen-Cachetools Autoform/SpecsGen/Cachetools.lean 79
          check SpecsGen-Basis      Autoform/SpecsGen/Basis.lean      21
          check SpecsGen-V8Base     Autoform/SpecsGen/V8Base.lean    229
          check SpecsGen-LinuxLib   Autoform/SpecsGen/LinuxLib.lean   12
          check Refine              Autoform/Refine.lean             113
          exit $fail

      # ...and the count is only meaningful for a module that proves. This is the
      # check the count was standing in for.
      - name: SpecsGen modules elaborate
        run: python3 scripts/check_specs.py Basis

      # SpecsGen/Cachetools.lean is KNOWN BROKEN and pinned here rather than
      # deleted. Its `C_tfFree` premise -- every body in the function table is
      # `tryFinally`-free, which every fuel-transported theorem in the module rests
      # on -- became false when the exporter learned to translate `try/finally`:
      # the current render holds 49 `.tryFinally` nodes where the AST it was
      # generated against had none. It needs regeneration, not repair.
      #
      # Pinning the failure keeps it visible AND catches the day it changes: if it
      # starts passing, this step fails and tells you to drop the pin. A known
      # breakage that nothing asserts is a known breakage nobody will notice
      # healing or worsening.
      - name: SpecsGen/Cachetools is still broken for the recorded reason
        run: |
          set -euo pipefail
          if python3 scripts/check_specs.py Cachetools > ct.out 2>&1; then
            echo "SpecsGen/Cachetools.lean now elaborates. That is good news, and it"
            echo "means this pin is stale: delete this step and add Cachetools to the"
            echo "'SpecsGen modules elaborate' step above."
            cat ct.out; exit 1
          fi
          cat ct.out
          grep -q 'FAIL     Cachetools' ct.out || {
            echo "Cachetools failed for a DIFFERENT reason than the recorded one."
            echo "Read the output above before touching this pin."; exit 1; }

      # The artifact policy makes the AST the tracked source of truth and the
      # render a build product. check_render verifies both halves against
      # artifact-manifest.json and reports UNVERIFIABLE (non-zero) when an AST is
      # absent rather than passing on an empty comparison.
      - name: check_specs / check_render report, for the log
        if: always()
        run: |
          python3 scripts/check_render.py || true

      # Demo.lean deliberately contains a `sorry`-admitted theorem and two
      # deliberately-failing audits, to demonstrate that the audit catches them.
      # `lean` therefore exits non-zero by design; what we check is that it runs
      # and that the expected diagnostics appear.
      - name: Run the demo
        run: |
          set -o pipefail
          lake env lean Demo.lean 2>&1 | tee demo.out || true
          grep -q "TRUSTED-CODE LEAK" demo.out
          grep -q "VACUOUS" demo.out

  # ------------------------------------------------------------------ #
  # OPTIONAL / MANUAL ONLY.
  #
  # Joern is a ~1.7 GB download, so the CPG -> AST -> Lean pipeline is NOT
  # part of the gating build. Run it by hand from the Actions tab, or on a
  # schedule, when the exporter or the transpiler changes.
  # ------------------------------------------------------------------ #
  joern-pipeline:
    name: end-to-end pipeline (Joern, manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_joern == true

    steps:
      - uses: actions/checkout@v4

      - name: Install elan / Lean
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Joern (~1.7 GB — this is why the job is opt-in)
        run: |
          set -euo pipefail
          curl -L https://github.com/joernio/joern/releases/latest/download/joern-install.sh -o joern-install.sh
          chmod +x joern-install.sh
          sudo ./joern-install.sh --without-plugins
          joern --version

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.toml', 'Autoform/**/*.lean', 'Autoform.lean') }}

      - name: lake build
        run: lake build

      - name: End-to-end run on the sample corpus
        env:
          JOERN_HOME: /opt/joern
        run: |
          mkdir -p /tmp/corpus
          cp -r cartographer /tmp/corpus/ 2>/dev/null || true
          ./autoform.sh /tmp/corpus Pipeline

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            ast-*.json
            formalization-graph.json
            conformance.json
          if-no-files-found: warn
