name: Machine-code formalization

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  machine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-machine.txt
      - name: Install machine frontend and test dependencies
        run: python -m pip install -r requirements-machine.txt -r requirements.txt 'pytest>=8,<9'
      - name: Install pinned Lean
        run: |
          curl -sSfL --retry 5 --retry-all-errors https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # elan defers the toolchain download to the first `lean` call; a transient
          # TLS failure there (2026-10-10, releases.lean-lang.org) killed the job
          # before anything was built. Fetch the toolchain here and retry.
          for attempt in 1 2 3 4 5; do
            "$HOME/.elan/bin/elan" run "$(cat lean-toolchain)" lean --version && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 30))
          done
      - name: Build semantics and kernel-check regression properties
        # The source-tooling tests below generate Lean files that import the spec
        # vocabulary and the audit commands; building only PCode left
        # Autoform/Harness/Audit.olean missing and three tests failing on a missing object.
        run: lake build Autoform.Lang.PCode.Properties Autoform.SpecsGen.Basis Autoform.Harness.Audit Autoform.Lang.Core.Observation
      - name: Source tooling, machine execution, and native conformance
        env:
          AUTOFORM_REQUIRE_LEAN: '1'
        run: python -m pytest tests -q
      - name: Assembly to kernel-checked observation
        run: >-
          ./autoform.sh --machine examples/machine/add_aarch64.s Add
          --assemble aarch64-unknown-linux-gnu --entry 0
          --register x0=3 --register x1=4 --stop 4 --expect x0=7
      - name: Independent kernel replay
        run: lake env leanchecker --fresh Autoform.Lang.PCode.Properties
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: machine-formalization
          path: artifacts/machine/
          if-no-files-found: warn
