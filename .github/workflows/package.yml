name: Python package

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Linux sandbox prerequisites (bubblewrap; unprivileged user namespaces)
        # This runner is an ephemeral VM for this job alone. AppArmor restricts unprivileged
        # user namespaces on Ubuntu 24.04; bubblewrap needs them to confine the code under test.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-net --ro-bind / / true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      # build creates the wheel FROM the sdist, catching missing source resources.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Distribution bytes, versions and license notices match source
        run: python scripts/check_distribution.py dist
      - name: Release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  install:
    permissions:
      contents: read
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - run: python -m pip install pytest packaging 'tomli>=2,<3; python_version < "3.11"'
      - name: Install wheel and exercise CLI outside checkout
        run: |
          export AUTOFORM_TEST_WHEEL="$(find "$PWD/dist" -name '*.whl' -print -quit)"
          python -m pytest tests/test_package.py -q

  installed-proofs:
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Linux sandbox prerequisites (bubblewrap; unprivileged user namespaces)
        # This runner is an ephemeral VM for this job alone. AppArmor restricts unprivileged
        # user namespaces on Ubuntu 24.04; bubblewrap needs them to confine the code under test.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-net --ro-bind / / true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Install wheel with machine dependencies
        run: |
          python -m pip install packaging
          python scripts/check_distribution.py dist
          wheel=$(find "$PWD/dist" -name '*.whl' -print -quit)
          python -m pip install "${wheel}[machine]"
      - name: Install pinned Lean
        run: |
          curl -sSfL --retry 5 --retry-all-errors https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # elan defers the toolchain download to the first `lean` call; a transient
          # TLS failure there (2026-10-10, releases.lean-lang.org) killed the job
          # before anything was built. Fetch the toolchain here and retry.
          for attempt in 1 2 3 4 5; do
            "$HOME/.elan/bin/elan" run "$(cat lean-toolchain)" lean --version && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 30))
          done
      - name: Assembly to a kernel checked theorem outside the repository
        run: |
          cd "$RUNNER_TEMP"
          autoform init
          autoform machine .autoform-work/examples/machine/add_aarch64.s Installed \
            --assemble aarch64-unknown-linux-gnu --entry 0 \
            --register x0=3 --register x1=4 --stop 4 --expect x0=7
          cd .autoform-work
          lake build Autoform.Lang.PCode.Properties
          lake env leanchecker --fresh Autoform.Lang.PCode.Properties
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installed-machine-evidence
          path: ${{ runner.temp }}/.autoform-work/artifacts/machine/

  source-proofs:
    permissions:
      contents: read
    needs: build
    if: github.event_name == 'release'
    uses: ./.github/workflows/source.yml
    with:
      distribution_artifact: python-distributions

  repository-checks:
    permissions:
      contents: read
    if: github.event_name == 'release'
    uses: ./.github/workflows/ci.yml

  machine-checks:
    permissions:
      contents: read
    if: github.event_name == 'release'
    uses: ./.github/workflows/machine.yml

  # Supply-chain evidence for the exact bytes that publish uploads: a CycloneDX SBOM
  # of the installed wheel's dependency closure and a build-provenance attestation
  # (SLSA-style, signed through GitHub's OIDC identity) for the wheel and sdist. Both are
  # attached to the GitHub release. This job cannot publish to PyPI; the publish job
  # cannot write attestations or release assets.
  evidence:
    if: github.event_name == 'release'
    needs: [install, installed-proofs, source-proofs, repository-checks, machine-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload the SBOM to the release
      id-token: write       # sign the attestation with the workflow's OIDC identity
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: CycloneDX SBOM of the installed wheel
        # The tool lives in its own virtualenv so it does not appear in the SBOM of the
        # environment it inspects. The version is pinned; PyPI hashes are not (see docs/packaging.md).
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sbom-tool"
          "$RUNNER_TEMP/sbom-tool/bin/pip" install --quiet 'cyclonedx-bom==7.5.0'
          python -m venv "$RUNNER_TEMP/sbom-target"
          "$RUNNER_TEMP/sbom-target/bin/pip" install --quiet dist/*.whl
          "$RUNNER_TEMP/sbom-tool/bin/cyclonedx-py" environment --pyproject pyproject.toml \
            --of JSON -o "autoform-lean-${{ github.event.release.tag_name }}.cdx.json" \
            "$RUNNER_TEMP/sbom-target/bin/python"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: autoform-lean-*.cdx.json
          if-no-files-found: error
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "autoform-lean-${TAG}.cdx.json" --clobber

  publish:
    if: github.event_name == 'release'
    needs: [install, installed-proofs, source-proofs, repository-checks, machine-checks, evidence]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/autoform-lean
    permissions:
      id-token: write       # PyPI trusted publishing only; no contents access
    steps:
      - name: Linux sandbox prerequisites (bubblewrap; unprivileged user namespaces)
        # This runner is an ephemeral VM for this job alone. AppArmor restricts unprivileged
        # user namespaces on Ubuntu 24.04; bubblewrap needs them to confine the code under test.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-net --ro-bind / / true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish using the configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
