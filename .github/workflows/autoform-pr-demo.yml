name: autoform pr (demo)
on:
  pull_request:
    paths: ['examples/demo/**', '.github/workflows/autoform-pr-demo.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: mbhatt1/autoform@becfe15f513aa52a7906772657b32dc411b6a4e4
        with:
          subdir: examples/demo
          module: DemoPricing
