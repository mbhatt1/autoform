# autoform pr on a GitLab merge request. UNTESTED: written against GitLab's documented
# predefined variables, never run on a GitLab instance. Treat the first run as the test.
#
# Assumes a runner image that already has the pinned Lean (elan), Joern (JOERN_HOME),
# a JDK, bubblewrap and Python 3.10+; `autoform doctor` fails the job early, naming
# whatever is missing. AUTOFORM_SRC is a checkout or mirror of autoform you have pinned.
# See docs/github-action.md, "Other CI systems".

autoform-pr:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"                  # the base commit must be in the clone
    AUTOFORM_WORKSPACE: "$CI_PROJECT_DIR/.autoform-work"
    AUTOFORM_PROBE_JOBS: "1"
  cache:
    key: autoform-workspace         # the built Lean project; a cold build is slow
    paths: [.autoform-work/]
  script:
    - python3 -m pip install --quiet "$AUTOFORM_SRC"
    - autoform --workspace "$AUTOFORM_WORKSPACE" doctor
    # Exit codes: 0 nothing refuted, 1 a function refuted, 2 could not run, 3 inconclusive
    # (no evidence when --fail-on was set, meaning no changed non-test function was compared).
    # allow_failure below lets a refutation be reported without blocking the merge; drop
    # it to block.
    - >-
      autoform --workspace "$AUTOFORM_WORKSPACE" pr . PullRequest
      --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA"
      --fail-on no-evidence
      --sarif autoform-pr.sarif --markdown autoform-pr.md
  allow_failure:
    exit_codes: [1, 3]
  artifacts:
    when: always
    paths:
      - autoform-pr.sarif
      - autoform-pr.md
      - .autoform-work/artifacts/pr/PullRequest/pr.json
